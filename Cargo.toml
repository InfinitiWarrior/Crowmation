[workspace]
resolver = "3"
members = ["core", "lang", "text", "render", "encode", "preview", "cli", "mesh"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/InfinitiWarrior/Crowmation"
homepage = "https://crowmation.com"

[workspace.dependencies]
crowmation-core = { path = "core" }
crowmation-render = { path = "render" }
crowmation-lang = { path = "lang" }
crowmation-text = { path = "text" }
crowmation-mesh = { path = "mesh" }
crowmation-encode = { path = "encode" }
glam = { version = "0.34", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"

[profile.release]
lto = "thin"

# Release downloads: smaller and a bit faster, slower to build.
# cargo build --profile dist -p crowmation
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
