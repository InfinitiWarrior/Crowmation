[package]
name = "crowmation-encode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# NVIDIA hardware encoding. The driver libraries (libnvidia-encode, libcuda) are
# loaded at run time, so the same binary builds and runs on machines without
# them and falls back to openh264.
nvenc = ["dep:nvidia-video-codec-sdk", "dep:cudarc", "dep:libloading"]

[dependencies]
muxide = "0.5"
openh264 = "0.9"
# `ci-check`: do not link the driver at build time (see src/nvenc_load.rs). It
# also picks cudarc's CUDA 12.2 API with dynamic loading, so no CUDA toolkit is needed.
nvidia-video-codec-sdk = { version = "0.4", features = ["ci-check"], optional = true }
cudarc = { version = "0.16", optional = true }
libloading = { version = "0.8", optional = true }
