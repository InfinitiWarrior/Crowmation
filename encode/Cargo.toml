[package]
name = "crowmation-encode"
version = "0.1.0"
edition.workspace = true

[features]
# NVIDIA hardware encoding. Needs the NVIDIA driver (libnvidia-encode, libcuda) at build and run time.
nvenc = ["dep:nvidia-video-codec-sdk", "dep:cudarc"]

[dependencies]
muxide = "0.5"
openh264 = "0.9"
nvidia-video-codec-sdk = { version = "0.4", optional = true }
# Pins a CUDA API version so cudarc's build does not need the CUDA toolkit (nvcc).
cudarc = { version = "0.16", features = ["cuda-12090"], optional = true }
